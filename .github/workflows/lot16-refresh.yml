name: LOT16 dependency and format refresh

on:
  push:
    branches:
      - feat/lot16-v2-identity-continuity
    paths:
      - apps/api/package.json
      - .github/workflows/lot16-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/lot16-v2-identity-continuity
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.24.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only
      - name: Format LOT16 files
        run: >
          pnpm exec prettier --write
          packages/database/prisma/schema.prisma
          packages/database/prisma/migrations/20261029093000_legacy_identity_continuity/migration.sql
          apps/api/src/modules/iam/infrastructure/crypto.ts
          apps/api/src/modules/iam/infrastructure/iam.repository.ts
          apps/api/src/modules/iam/application/auth.service.ts
          apps/api/src/modules/iam/presentation/http/auth.controller.ts
          apps/api/package.json
          apps/api/tests/iam.test.ts
          apps/web/src/features/auth/auth-pages.tsx
          apps/web/messages/fr.json
          apps/web/messages/en.json
          apps/web/messages/ar.json
          apps/web/e2e/academic-helpers.ts
          apps/web/e2e/iam.spec.ts
          apps/web/e2e/lot1.spec.ts
          docs/lot16-identity-continuity.md
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml packages/database/prisma/schema.prisma packages/database/prisma/migrations/20261029093000_legacy_identity_continuity/migration.sql apps/api/src/modules/iam/infrastructure/crypto.ts apps/api/src/modules/iam/infrastructure/iam.repository.ts apps/api/src/modules/iam/application/auth.service.ts apps/api/src/modules/iam/presentation/http/auth.controller.ts apps/api/package.json apps/api/tests/iam.test.ts apps/web/src/features/auth/auth-pages.tsx apps/web/messages/fr.json apps/web/messages/en.json apps/web/messages/ar.json apps/web/e2e/academic-helpers.ts apps/web/e2e/iam.spec.ts apps/web/e2e/lot1.spec.ts docs/lot16-identity-continuity.md
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git commit -m "chore(lot16): refresh lockfile and formatting"
          git push origin HEAD:feat/lot16-v2-identity-continuity
