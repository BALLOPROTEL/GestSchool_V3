name: LOT17.2 final formatter

on:
  push:
    branches:
      - feat/lot17-settings
    paths:
      - .github/workflows/lot17-settings-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/lot17-settings
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format LOT17.2 follow-up
        run: |
          pnpm exec prettier --write             packages/contracts/src/settings.ts             apps/api/src/modules/settings/infrastructure/settings.repository.ts             apps/api/src/modules/documents/infrastructure/documents.repository.ts             apps/api/tests/settings.test.ts             apps/api/tests/documents.test.ts             apps/web/src/features/settings/settings-page.tsx             apps/web/e2e/lot1.spec.ts

      - name: Remove workflow and commit
        run: |
          git rm .github/workflows/lot17-settings-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(lot17): format final settings fixes"
          git push origin HEAD:feat/lot17-settings
