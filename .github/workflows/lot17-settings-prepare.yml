name: LOT17.2 one-shot prepare

on:
  push:
    branches:
      - feat/lot17-settings
    paths:
      - .github/workflows/lot17-settings-prepare.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LOT17.2 branch
        uses: actions/checkout@v6
        with:
          ref: feat/lot17-settings
          fetch-depth: 0

      - name: Refresh staging migration manifest
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const root = 'packages/database/prisma/migrations';
          const names = (await readdir(root, { withFileTypes: true }))
            .filter((entry) => entry.isDirectory())
            .map((entry) => entry.name)
            .sort();
          const entries = [];
          for (const name of names) {
            const content = await readFile(join(root, name, 'migration.sql'), 'utf8');
            entries.push({
              name,
              checksum: createHash('sha256').update(content).digest('hex'),
            });
          }
          const manifestHash = createHash('sha256')
            .update(JSON.stringify(entries))
            .digest('hex');

          const scriptPath = 'scripts/staging-migrate.mjs';
          let script = await readFile(scriptPath, 'utf8');
          script = script
            .replace(/const manifestHash = '[0-9a-f]+';/, `const manifestHash = '${manifestHash}';`)
            .replace(/expected\.length !== \d+/, `expected.length !== ${entries.length}`);
          await writeFile(scriptPath, script);

          const testPath = 'scripts/staging-migrate.test.mjs';
          let test = await readFile(testPath, 'utf8');
          test = test
            .replace(/pinned \d+ migrations/g, `pinned ${entries.length} migrations`)
            .replace(/applied: \d+/g, `applied: ${entries.length}`);
          await writeFile(testPath, test);

          console.log({ count: entries.length, manifestHash, latest: entries.at(-1)?.name });
          NODE

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format LOT17.2 files
        run: |
          pnpm exec prettier --write             packages/contracts/src/settings.ts             packages/contracts/src/iam.ts             apps/api/src/modules/settings             apps/api/tests/settings.test.ts             apps/api/src/app.module.ts             apps/web/src/features/settings/settings-page.tsx             apps/web/messages/fr.json             apps/web/messages/en.json             apps/web/messages/ar.json             scripts/staging-migrate.mjs             scripts/staging-migrate.test.mjs

      - name: Remove one-shot workflow and commit prepared branch
        run: |
          git rm .github/workflows/lot17-settings-prepare.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(lot17): prepare settings migration and formatting"
          git push origin HEAD:feat/lot17-settings
