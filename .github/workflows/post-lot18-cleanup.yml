name: Post-LOT18 branch and tag cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: run post-LOT18 branch-tag cleanup'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Create missing LOT certification tags
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          create_tag() {
            local tag="$1"
            local sha="$2"
            local message="$3"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "$tag already exists"
              return
            fi
            git tag -a "$tag" "$sha" -m "$message"
            git push origin "refs/tags/$tag"
          }

          create_tag lot-15-go 0e0acdb502dbc32ffcf0aa37ac6433cdc6c69921 "LOT15 — GO technique / production réelle non autorisée"
          create_tag lot-16-go 9389c86d3bed5859b65cc6ef230d19d9f1c61459 "LOT16 — continuité identité V2 → V3 certifiée, sans migration réelle"
          create_tag lot-17-go 7228018b00a31816828525991cda6bca31b1cc33 "LOT17 — zéro mock métier visible / staging PASS"
          create_tag lot-18-go 9b8ff4196a0352582506be7ce1c3b79b1996cb7a "LOT18 — TECH PASS + MANUAL PASS"

      - name: Delete all obsolete remote branches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); print $2}')
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting obsolete branch: $branch"
            git push origin --delete "$branch"
          done
