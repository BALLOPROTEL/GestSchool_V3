name: LOT16 format refresh

on:
  push:
    branches:
      - feat/lot16-owner-staging-migration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/lot16-owner-staging-migration
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format LOT16 migration files
        run: |
          pnpm exec prettier --write \
            apps/api/src/modules/iam/application/legacy-v2-owner-migration.service.ts \
            apps/api/src/modules/iam/application/legacy-v2-owner-migration.service.test.ts \
            apps/api/src/modules/iam/infrastructure/iam.repository.ts \
            apps/api/src/modules/iam/infrastructure/iam-runtime.ts \
            apps/api/src/modules/iam/infrastructure/rate-limiter.ts \
            apps/api/src/modules/iam/presentation/http/auth.controller.ts \
            apps/api/src/modules/iam/presentation/http/security.ts \
            apps/web/src/features/auth/auth-pages.tsx \
            apps/web/src/app/[locale]/(auth)/migrate-v2/page.tsx \
            apps/web/e2e/lot1.spec.ts \
            apps/web/messages/fr.json \
            apps/web/messages/en.json \
            apps/web/messages/ar.json

      - name: Remove temporary workflow
        run: rm .github/workflows/lot16-format-refresh.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style(lot16): apply repository formatting"
          git push origin HEAD:feat/lot16-owner-staging-migration
