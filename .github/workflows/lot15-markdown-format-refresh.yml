name: LOT15 markdown format refresh

on:
  push:
    branches:
      - feat/lot15-production-readiness
    paths:
      - docs/lot15-rollback-rehearsal-evidence.md
      - .github/workflows/lot15-markdown-format-refresh.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/lot15-production-readiness
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.24.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format LOT15 rollback evidence
        run: pnpm exec prettier docs/lot15-rollback-rehearsal-evidence.md --write
      - name: Commit formatted evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lot15-rollback-rehearsal-evidence.md
          if git diff --cached --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git commit -m "style(lot15): format rollback rehearsal evidence"
          git push origin HEAD:feat/lot15-production-readiness
