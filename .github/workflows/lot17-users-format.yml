name: LOT17.3 final formatter

on:
  push:
    branches:
      - feat/lot17-users
    paths:
      - .github/workflows/lot17-users-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/lot17-users
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format LOT17.3 follow-up
        run: |
          pnpm exec prettier --write             apps/api/src/modules/iam/application/credentials.service.ts             apps/web/src/features/directory/directory-pages.tsx             apps/web/messages/fr.json             apps/web/messages/en.json             apps/web/messages/ar.json             apps/api/tests/e2e-auth-fixture.ts

      - name: Remove workflow and commit
        run: |
          git rm .github/workflows/lot17-users-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(lot17): format user administration follow-up"
          git push origin HEAD:feat/lot17-users
