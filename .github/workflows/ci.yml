name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://gestschool:gestschool-ci-only@127.0.0.1:5432/gestschool
      NODE_ENV: test
      IAM_ENV: local
      REDIS_URL: redis://127.0.0.1:6379
    services:
      redis:
        image: redis:8.10.1-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: gestschool
          POSTGRES_PASSWORD: gestschool-ci-only
          POSTGRES_USER: gestschool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestschool -d gestschool"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Generate ephemeral IAM test keys
        run: pnpm iam:keys

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Seed test database
        run: pnpm db:seed

      - name: Test database integrity
        run: pnpm db:test

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Certify IAM, directories, academics, enrollments and finance against PostgreSQL and Redis
        run: pnpm iam:test

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test frontend, IAM, directory, academic, enrollment and finance journeys
        run: pnpm test:e2e
