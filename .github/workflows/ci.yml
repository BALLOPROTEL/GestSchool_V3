name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://gestschool:gestschool-ci-only@127.0.0.1:5432/gestschool
      NODE_ENV: test
      IAM_ENV: local
      REDIS_URL: redis://127.0.0.1:6379
      DOCUMENT_PUBLIC_ORIGIN: http://127.0.0.1:3000
    services:
      redis:
        image: redis:8.10.1-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: gestschool
          POSTGRES_PASSWORD: gestschool-ci-only
          POSTGRES_USER: gestschool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestschool -d gestschool"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Start private document storage
        run: |
          docker run --detach --name gestschool-ci-minio --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=gestschool-local --env MINIO_ROOT_PASSWORD=gestschool-local-secret \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9000/minio/health/live
          docker run --rm --network host --entrypoint /bin/sh minio/mc:RELEASE.2025-08-13T08-35-41Z -ec '
            mc alias set ci http://127.0.0.1:9000 gestschool-local gestschool-local-secret
            mc mb ci/gestschool-local-private
            mc anonymous set none ci/gestschool-local-private'

      - name: Install Chromium for worker PDF and frontend tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate ephemeral IAM test keys
        run: pnpm iam:keys

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Seed test database
        run: pnpm db:seed

      - name: Test database integrity
        run: pnpm db:test

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Keep Argon2 tests within their existing timeout on shared CI runners.
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Certify IAM, directories, academics, enrollments, finance, results and official documents
        run: pnpm iam:test

      - name: Test frontend, IAM, directory, academic, enrollment, finance, results and document journeys
        run: pnpm test:e2e
