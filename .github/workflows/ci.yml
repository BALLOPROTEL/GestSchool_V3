name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://gestschool:gestschool-ci-only@127.0.0.1:5432/gestschool
      NODE_ENV: test
      IAM_ENV: local
      REDIS_URL: redis://127.0.0.1:6379
      DOCUMENT_PUBLIC_ORIGIN: http://127.0.0.1:3000
    services:
      redis:
        image: redis:8.10.1-alpine3.23@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      postgres:
        image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_DB: gestschool
          POSTGRES_PASSWORD: gestschool-ci-only
          POSTGRES_USER: gestschool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestschool -d gestschool"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5 (peeled commit)
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Start private document storage
        run: sh scripts/ci-storage.sh

      - name: Install Chromium for worker PDF and frontend tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate ephemeral IAM test keys
        run: pnpm iam:keys

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Seed test database
        run: pnpm db:seed

      - name: Test database integrity
        run: pnpm db:test

      - name: Certify PostgreSQL backup and restore locally
        run: pnpm db:backup-restore:test

      - name: Certify Redis and BullMQ restart recovery locally
        run: pnpm redis:recovery:test

      - name: Certify messaging on a fresh isolated database
        env:
          DATABASE_NAME: gestschool_lot11_ci
          DATABASE_URL: postgresql://gestschool:gestschool-ci-only@127.0.0.1:5432/gestschool_lot11_ci
          REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          DATABASE_URL=postgresql://gestschool:gestschool-ci-only@127.0.0.1:5432/gestschool pnpm db:create:isolated
          pnpm db:migrate:deploy
          pnpm db:seed
          pnpm db:test
          pnpm messaging:test

      - name: Certify dashboards and reports on a fresh isolated database
        env:
          DATABASE_NAME: gestschool_lot12_ci
          DATABASE_URL: postgresql://gestschool:gestschool-ci-only@127.0.0.1:5432/gestschool_lot12_ci
          REDIS_URL: redis://127.0.0.1:6379/14
        run: |
          DATABASE_URL=postgresql://gestschool:gestschool-ci-only@127.0.0.1:5432/gestschool pnpm db:create:isolated
          pnpm db:migrate:deploy
          pnpm db:seed
          pnpm db:test
          pnpm reports:test

      - name: Certify bounded local capacity and partial failure
        run: pnpm capacity:test

      - name: Check formatting
        run: pnpm format:check

      - name: Security hardening certification
        run: |
          pnpm security:secrets --history
          pnpm security:test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Keep Argon2 tests within their existing timeout on shared CI runners.
        run: pnpm test

      - name: Build
        run: pnpm security:bundle

      - name: Certify IAM, directories, academics, enrollments, finance, results and official documents
        run: pnpm iam:test

      - name: Test frontend, IAM, directory, academic, enrollment, finance, results and document journeys
        run: pnpm test:e2e
