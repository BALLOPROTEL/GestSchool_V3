name: gestschool-local

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestschool}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestschool-local-only}
      POSTGRES_USER: ${POSTGRES_USER:-gestschool}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          CMD-SHELL,
          'PGPASSWORD="$${POSTGRES_PASSWORD}" pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - gestschool

  redis:
    image: redis:8.10.1-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gestschool-local-redis}
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD:-gestschool-local-redis}
      - --protected-mode
      - 'yes'
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - gestschool

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-gestschool-local-secret}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-gestschool-local}
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - gestschool

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: 'no'
    profiles:
      - tools
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-gestschool-local}
      S3_BUCKET: ${S3_BUCKET:-gestschool-local-private}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-gestschool-local-secret}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
        mc stat "local/$${S3_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - gestschool

volumes:
  minio_data:
    name: gestschool-local-minio-data
  postgres_data:
    name: gestschool-local-postgres-data
  redis_data:
    name: gestschool-local-redis-data

networks:
  gestschool:
    name: gestschool-local-network
    driver: bridge
